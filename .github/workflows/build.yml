name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyserial requests pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --name raporoku-agent --console agent.py

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/raporoku-agent.exe
